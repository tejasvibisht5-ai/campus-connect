
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Registration - CampusConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
        }

        .strength-track {
            height: 7px;
            background: #e5e7eb;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: 0.3s;
        }

        .strength-text {
            display: block;
            margin-top: 6px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <a href="{{ url_for('home') }}" class="brand">
        <span class="brand-icon">&#127891;</span>
        Campus<span>Connect</span>
    </a>

    <div class="navlinks">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('events_page') }}">Events</a>
        <a href="{{ url_for('clubs_page') }}">Clubs</a>
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
    </div>
</nav>

<main class="auth-page">

    <div class="form-box">

        <div class="login-icon">&#128104;&#8205;&#127979;</div>

        <h1>Faculty Registration</h1>

        <p class="login-subtitle">
            Create your faculty account on CampusConnect
        </p>

        <form method="POST"
              action="{{ url_for('faculty_register') }}">

            <div class="input-group">
                <label for="name">Full Name *</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your full name"
                       required>
            </div>

            <div class="input-group">
                <label for="employee_id">Employee ID *</label>
                <input type="text"
                       id="employee_id"
                       name="employee_id"
                       placeholder="Enter your employee ID"
                       required>
            </div>

            <div class="input-group">
                <label for="department">Department *</label>
                <select id="department" name="department" required>
                    <option value="" disabled selected>
                        Select department
                    </option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Civil">Civil</option>
                    <option value="Management">Management</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="input-group">
                <label for="email">University Email *</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your university email"
                       required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number *</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="Enter your phone number"
                       required>
            </div>

            <div class="input-group">
                <label for="password">Create Password *</label>

                <div class="password-wrapper">
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Create a password"
                           minlength="8"
                           required>

                    <button type="button"
                            class="toggle-password"
                            id="togglePassword">
                        👁
                    </button>
                </div>

                <div class="strength-track">
                    <div class="strength-fill"
                         id="strengthFill"></div>
                </div>

                <small class="strength-text" id="strengthText">
                    Use at least 8 characters.
                </small>
            </div>

            <button type="submit" class="login-button">
                Create Faculty Account
            </button>

        </form>

        <p class="register-text">
            Already registered?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>

    </div>

</main>

<script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");
    const fill = document.getElementById("strengthFill");
    const strengthText = document.getElementById("strengthText");

    toggle.addEventListener("click", function () {
        const hidden = password.type === "password";

        password.type = hidden ? "text" : "password";
        toggle.textContent = hidden ? "🙈" : "👁";
    });

    password.addEventListener("input", function () {
        const value = password.value;
        let score = 0;

        if (value.length >= 8) score++;
        if (/[A-Z]/.test(value)) score++;
        if (/[a-z]/.test(value)) score++;
        if (/[0-9]/.test(value)) score++;
        if (/[^A-Za-z0-9]/.test(value)) score++;

        const levels = [
            ["0%", "Use at least 8 characters.", "#dc3545"],
            ["20%", "Very Weak", "#dc3545"],
            ["40%", "Weak", "#fd7e14"],
            ["60%", "Fair", "#ffc107"],
            ["80%", "Good", "#0d6efd"],
            ["100%", "Strong", "#198754"]
        ];

        const level = value.length === 0 ? levels[0] : levels[score];

        fill.style.width = level[0];
        fill.style.background = level[2];
        strengthText.textContent = level[1];
    });
</script>

</body>
</html>
