<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
    <a href="{{ url_for('home') }}" class="brand">CampusConnect</a>
    <div class="navlinks">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('events_page') }}">Events</a>
        <a href="{{ url_for('clubs_page') }}">Clubs</a>
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
        {% if session.get('student_email') or session.get('club_email') %}
            <a href="{{ url_for('logout') }}">Logout</a>
        {% endif %}
    </div>
</nav>

<main class="container">
    {% for message in get_flashed_messages() %}
        <p class="notice">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html></title>
</head>
<body>

</body>
</html>
